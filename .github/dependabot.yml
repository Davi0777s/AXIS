version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "pip"
    commit-message:
      prefix: "deps(pip)"
    groups:
      pyside6:
        patterns:
          - "PySide6"
      qt:
        patterns:
          - "shiboken6"
    ignore:
      - dependency-name: "PySide6"
        versions: ["<6.11.2"]
      - dependency-name: "shiboken6"
        versions: ["<6.11.2"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "deps(actions)"