name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        # Tests assert a self-contained "AXIS" root (matching a portable install).
        working-directory: AXIS

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: AXIS

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Provision runtime tools (adb + scrcpy)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path tools | Out-Null
          $ptZip = "tools\platform-tools.zip"
          Invoke-WebRequest -Uri "https://dl.google.com/android/repository/platform-tools-latest-windows.zip" -OutFile $ptZip
          Expand-Archive -LiteralPath $ptZip -DestinationPath "tools" -Force
          Remove-Item $ptZip -Force
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/genymobile/scrcpy/releases/latest" -Headers @{ "User-Agent" = "AXIS-CI" }
          $asset = $release.assets | Where-Object { $_.name -like "scrcpy-win64-*.zip" } | Sort-Object size -Descending | Select-Object -First 1
          $scrcpyZip = "tools\scrcpy.zip"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $scrcpyZip
          Expand-Archive -LiteralPath $scrcpyZip -DestinationPath "tools" -Force
          Remove-Item $scrcpyZip -Force

      - name: Compile check
        run: python -m compileall -q axis.py src

      - name: Run tests (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONIOENCODING: utf-8
        run: |
          python -m unittest discover -s tests -v

  # Build artifacts only on main
  build:
    needs: lint-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: python -m PyInstaller --noconfirm AXIS.spec

      - name: Package runtime
        run: |
          $root = "${{ github.workspace }}"
          $dist = "$root\dist\AXIS"
          foreach ($d in @("scripts","wifi-fix","tools","firmware")) {
            if (Test-Path -LiteralPath "$root\$d") {
              Copy-Item -LiteralPath "$root\$d" -Destination $dist -Recurse -Force
            }
          }
          Copy-Item -LiteralPath "$root\axis.toml" -Destination $dist -Force
          Copy-Item -LiteralPath "$root\assets" -Destination $dist -Recurse -Force
          Copy-Item -LiteralPath "$root\README.md" -Destination $dist -Force

      - name: Create release zip
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $src = "${{ github.workspace }}\dist\AXIS"
          $zip = "${{ github.workspace }}\dist\AXIS-v${{ github.run_number }}.zip"
          [System.IO.Compression.ZipFile]::CreateFromDirectory($src, $zip, [System.IO.Compression.CompressionLevel]::Optimal, $false)

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AXIS-runtime
          path: dist/AXIS-v${{ github.run_number }}.zip
          retention-days: 30